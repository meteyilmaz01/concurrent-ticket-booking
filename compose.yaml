name: ticket-booking

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # The PostgreSQL 18 image stores data under /var/lib/postgresql/18/docker,
      # so the volume is mounted on the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Load tests (Chapter 2+). Not started by "docker compose up"; run with:
  #   docker compose run --rm k6 run /scripts/payment-load.js
  # The API and the fake payment gateway must be running on this machine.
  k6:
    image: grafana/k6:2.4.0
    profiles: ["load-test"]
    volumes:
      - ./load-tests:/scripts
    environment:
      BASE_URL: http://host.docker.internal:5287

volumes:
  postgres-data:
